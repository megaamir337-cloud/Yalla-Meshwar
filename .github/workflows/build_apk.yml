name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore & Grant Permissions
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ./debug.keystore || true
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon -x test
          elif [ -f "./app/gradlew" ]; then
            cd app && ./gradlew assembleDebug --no-daemon -x test
          else
            gradle assembleDebug --no-daemon -x test
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Meshwar-APK
          path: "**/build/outputs/apk/debug/*.apk"
