name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-Detect Project & Build APK
        run: |
          # البحث عن مجلد المشروع الذكي
          TARGET_FILE=$(find . -name "main.dart" -not -path "*/.*" | head -n 1)
          if [ -z "$TARGET_FILE" ]; then
            echo "Searching for any .dart file..."
            TARGET_FILE=$(find . -name "*.dart" -not -path "*/.*" | head -n 1)
          fi
          
          PROJ_DIR=$(dirname $(dirname "$TARGET_FILE"))
          echo "Building in directory: $PROJ_DIR"
          cd "$PROJ_DIR"
          
          flutter pub get
          flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Meshwar-APK
          path: "**/build/app/outputs/flutter-apk/*.apk"
