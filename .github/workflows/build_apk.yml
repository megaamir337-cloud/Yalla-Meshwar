name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build APK Automatic Search
        run: |
          if [ -f "lib/main.dart" ]; then
            flutter pub get
            flutter build apk --debug
          elif [ -f "app/lib/main.dart" ]; then
            cd app
            flutter pub get
            flutter build apk --debug
          else
            echo "Searching for main.dart..."
            MAIN_PATH=$(find . -name "main.dart" -not -path "*/.*" | head -n 1)
            PROJ_DIR=$(dirname $(dirname "$MAIN_PATH"))
            cd "$PROJ_DIR"
            flutter pub get
            flutter build apk --debug
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Meshwar-APK
          path: "**/build/app/outputs/flutter-apk/*.apk"
