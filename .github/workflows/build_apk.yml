name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ultimate Universal Build
        run: |
          # 1. البحث عن ملف التشغيل الرئيسي تلقائياً
          TARGET_FILE=$(find . -name "main.dart" -not -path "*/.*" | head -n 1)
          
          if [ -z "$TARGET_FILE" ]; then
            TARGET_FILE=$(find . -name "*.dart" -not -path "*/.*" | head -n 1)
          fi
          
          echo "Found Target File: $TARGET_FILE"
          
          # 2. تحديد مجلد المشروع وتجهيز الاعتمادات
          PROJ_DIR=$(dirname $(dirname "$TARGET_FILE"))
          cd "$PROJ_DIR"
          
          flutter pub get
          
          # 3. بناء ملف الـ APK وتحديده بدقة
          flutter build apk --debug -t "$TARGET_FILE"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yalla-Meshwar-APK
          path: "**/build/app/outputs/flutter-apk/*.apk"
